<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Личный сайт Артёма Коваленко. Публикации и статьи.">
    <title>Артём Коваленко — личный сайт</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #faf9f6; color: #222; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100svh; }
      a { color: inherit; text-underline-offset: .25em; }
      a:focus-visible, select:focus-visible { outline: 3px solid #775b35; outline-offset: 5px; }
      .container { width: min(100% - 3rem, 1040px); margin-inline: auto; }
      header { border-bottom: 1px solid #dedbd4; }
      .header-inner { min-height: 96px; display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; padding-block: 1.25rem; }
      .brand { font-weight: 650; text-decoration: none; }
      nav { display: flex; align-items: center; gap: 2rem; flex-wrap: wrap; }
      nav a { font-size: .95rem; }
      .language { display: flex; align-items: center; gap: .6rem; font-size: .85rem; }
      select { padding: .5rem; border: 1px solid #c8c3b9; border-radius: .35rem; color: inherit; background: transparent; font: inherit; }
      .intro { padding-block: clamp(4rem, 10vw, 8rem); }
      .eyebrow { margin: 0 0 1.25rem; color: #756b5c; font-size: .85rem; letter-spacing: .12em; text-transform: uppercase; }
      h1 { max-width: 900px; margin: 0; font-size: clamp(2.6rem, 7vw, 5.5rem); line-height: 1.08; font-weight: 600; letter-spacing: -.045em; }
      .intro p:last-child { max-width: 34rem; margin: 1.75rem 0 0; color: #625e57; font-size: 1.15rem; line-height: 1.7; }
      section { scroll-margin-top: 2rem; }
      .publications { padding-block: 2.5rem 5rem; border-top: 1px solid #dedbd4; }
      h2 { margin: 0 0 2rem; font-size: clamp(1.75rem, 4vw, 2.5rem); font-weight: 550; letter-spacing: -.025em; }
      .empty-state { padding: 2rem; border: 1px solid #dedbd4; border-radius: .5rem; }
      .empty-state h3 { margin: 0 0 .75rem; font-size: 1.15rem; font-weight: 550; }
      .empty-state p { margin: 0; color: #625e57; line-height: 1.7; max-width: 38rem; }
      footer { padding-block: 1.5rem; border-top: 1px solid #dedbd4; color: #756b5c; font-size: .85rem; }
      @media (max-width: 600px) { .container { width: min(100% - 2rem, 1040px); } nav { gap: 1rem; width: 100%; justify-content: space-between; } .language { gap: .4rem; } .empty-state { padding: 1.5rem; } }
    </style>
  </head>
  <body>
    <header id="home">
      <div class="container header-inner">
        <a class="brand" href="#home" data-i18n="name">Артём Коваленко</a>
        <nav aria-label="Основные разделы" id="navigation">
          <a href="#publications" data-i18n="publications">Публикации</a>
          <div class="language">
            <label for="language" data-i18n="language">Язык</label>
            <select id="language" name="language">
              <option value="ru" lang="ru">Русский</option>
              <option value="en" lang="en">English</option>
            </select>
          </div>
        </nav>
      </div>
    </header>
    <main class="container">
      <section class="intro" aria-labelledby="intro-title">
        <p class="eyebrow" data-i18n="personal">Личный сайт</p>
        <h1 id="intro-title" data-i18n="name">Артём Коваленко</h1>
        <p data-i18n="intro">Здесь я буду делиться своими статьями и публикациями.</p>
      </section>
      <section class="publications" id="publications" aria-labelledby="publications-title">
        <h2 id="publications-title" data-i18n="publications">Публикации</h2>
        <div class="empty-state">
          <h3 data-i18n="soon">Первые статьи — скоро</h3>
          <p data-i18n="empty">Раздел готовится к наполнению. Новые статьи будут появляться здесь.</p>
        </div>
      </section>
    </main>
    <footer><div class="container" data-i18n="name">Артём Коваленко</div></footer>
    <script>
      const translations = {
        ru: {
          name: 'Артём Коваленко', personal: 'Личный сайт', publications: 'Публикации', language: 'Язык',
          intro: 'Здесь я буду делиться своими статьями и публикациями.',
          soon: 'Первые статьи — скоро', empty: 'Раздел готовится к наполнению. Новые статьи будут появляться здесь.',
          title: 'Артём Коваленко — личный сайт', description: 'Личный сайт Артёма Коваленко. Публикации и статьи.', navigation: 'Основные разделы'
        },
        en: {
          name: 'Artem Kovalenko', personal: 'Personal website', publications: 'Publications', language: 'Language',
          intro: 'This is where I will share my articles and publications.',
          soon: 'First articles coming soon', empty: 'This section is being prepared. New articles will appear here.',
          title: 'Artem Kovalenko — personal website', description: 'The personal website of Artem Kovalenko. Publications and articles.', navigation: 'Main navigation'
        }
      };
      const selector = document.getElementById('language');
      function setLanguage(language) {
        const copy = translations[language];
        document.documentElement.lang = language;
        document.title = copy.title;
        document.querySelector('meta[name="description"]').content = copy.description;
        document.getElementById('navigation').setAttribute('aria-label', copy.navigation);
        document.querySelectorAll('[data-i18n]').forEach(element => { element.textContent = copy[element.dataset.i18n]; });
        selector.value = language;
      }
      const requestedLanguage = new URLSearchParams(location.search).get('lang');
      let savedLanguage;
      try { savedLanguage = localStorage.getItem('language'); } catch {}
      setLanguage(Object.hasOwn(translations, requestedLanguage) ? requestedLanguage : Object.hasOwn(translations, savedLanguage) ? savedLanguage : 'ru');
      selector.addEventListener('change', () => {
        setLanguage(selector.value);
        try { localStorage.setItem('language', selector.value); } catch {}
        const url = new URL(location.href);
        url.searchParams.set('lang', selector.value);
        history.replaceState(null, '', url);
      });
    </script>
  </body>
</html>
