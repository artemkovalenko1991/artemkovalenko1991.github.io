<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        grid-template-rows: auto 1fr;
        background: #faf9f6;
        color: #222;
        font-family: system-ui, sans-serif;
      }

      nav ul {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 1rem 2rem;
        margin: 0;
        padding: 1.5rem 1rem;
        list-style: none;
        font-weight: 500;
      }

      main {
        display: grid;
        place-items: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 12vw, 8rem);
        font-weight: 600;
        letter-spacing: -0.04em;
      }
    </style>
  </head>
  <body>
    <header>
      <nav aria-label="Основные разделы">
        <ul>
          <li>Главная</li>
          <li>Статьи</li>
          <li>Контакты</li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>Hello</h1>
    </main>
  </body>
</html>
